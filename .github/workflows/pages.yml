name: Verify Godot and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: godot-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Godot and export templates
        run: |
          mkdir -p .tools/templates build/web build/windows
          base=https://github.com/godotengine/godot/releases/download/4.7.2-stable
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o .tools/engine.zip
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o .tools/templates.tpz
          python3 tools/verify_downloads.py
          unzip -q .tools/engine.zip -d .tools
          unzip -jq .tools/templates.tpz 'templates/web_nothreads_*.zip' 'templates/windows_*_x86_64.exe' -d .tools/templates
          chmod +x .tools/Godot_v4.7.2-stable_linux.x86_64
          echo "$PWD/.tools" >> "$GITHUB_PATH"
      - name: Import Blender assets and run logic tests
        run: |
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import 2>&1 | tee .tools/import.log
          ! grep -E 'SCRIPT ERROR|^ERROR:' .tools/import.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/simulation_test.gd
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/progression_test.gd
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/heavy_test.gd
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/expansion_test.gd
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/review_test.gd
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/patrol_test.gd
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/activity_test.gd
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/harvesters_test.gd
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/assets_test.gd
      - name: Export Web and Windows
        run: |
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release Web
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release Windows
          touch build/web/.nojekyll
      - name: Verify exported game in desktop and touch browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run serve > .tools/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4176/3d_astra_godot/ > /dev/null && break; sleep 1; done
          MOBILE_DPR=1 npm run test:browser
          npm run test:mobile-density
          MOBILE_DPR=1 npm run test:stages
          npm run test:harvesters
          npm run test:hotkeys
      - name: Verify Patrol and Harvester Attack controls
        # The dedicated mobile-density check above still exercises DPR 3.
        # Render functional viewport checks at DPR 1 on the software renderer.
        run: MOBILE_DPR=1 npm run test:patrol
      - name: Verify construction and harvesting feedback
        run: MOBILE_DPR=1 npm run test:activity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-verification
          path: |
            test-results/
            .tools/*.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: FrontierCommand-Windows
          path: build/windows/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: pages
